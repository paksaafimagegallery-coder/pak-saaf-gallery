<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Officer Login | Pak Saaf</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
<style>body{margin:0;font-family:'Inter',sans-serif;background:linear-gradient(135deg,#074822,#0b6b3a);height:100vh;display:flex;align-items:center;justify-content:center}.box{background:#fff;padding:40px;border-radius:16px;box-shadow:0 16px 48px rgba(0,0,0,.3);width:100%;max-width:400px;text-align:center}.logos{display:flex;justify-content:center;gap:20px;margin-bottom:20px}.logos img{height:80px;border-radius:8px}input{width:100%;padding:14px;margin-bottom:15px;border:1.5px solid #dde7e0;border-radius:8px;box-sizing:border-box}button{width:100%;padding:14px;background:#0b6b3a;color:#fff;border:none;border-radius:8px;font-weight:600;cursor:pointer}</style>
</head>
<body>
<div class="box">
  <div class="logos"><img src="/images/kp-logo.png" alt="KP"><img src="/images/dglg-logo.png" alt="DGLG"></div>
  <h2 style="font-family:'Poppins';color:#14241b">Officer Login</h2>
  <p style="color:#8a9b91;font-size:13px;margin-bottom:20px">Pak Saaf Image Gallery</p>
  <input type="text" id="username" placeholder="Username" required>
  <input type="password" id="password" placeholder="Password" required>
  <button onclick="login()">Login to Dashboard</button>
  <p id="err" style="color:#d32f2f;font-size:13px;margin-top:15px"></p>
  <p style="margin-top:20px;font-size:12px;color:#8a9b91">Developed by: @Engr. Shaleem Khokhar | 0300-5988832</p>
</div>
<script>
async function login() {
  const res = await fetch('/api/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ username: username.value, password: password.value })
  });
  if(res.ok) {
    const data = await res.json();
    localStorage.setItem('token', data.token); localStorage.setItem('role', data.role); localStorage.setItem('vcId', data.vcId);
    localStorage.setItem('mustChangePassword', data.mustChangePassword); localStorage.setItem('district', data.district); localStorage.setItem('tehsil', data.tehsil); localStorage.setItem('vcName', data.vcName);
    if(data.mustChangePassword) window.location.href = '/change-password.html';
    else window.location.href = '/dashboard.html';
  } else { err.innerText = 'Invalid username or password'; }
}
</script>
</body>
</html>
